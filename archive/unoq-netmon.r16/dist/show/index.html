<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overheard: UI options</title>
<style>
:root{--bg:#0C0D12;--fg:#EEF0F6;--mut:rgba(238,240,246,.6);--line:rgba(255,255,255,.12);--acc:#A99BFF}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.45 "Avenir Next","Helvetica Neue",system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{display:flex;gap:16px;align-items:baseline;padding:16px 24px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1 "Avenir Next Condensed","Avenir Next",sans-serif;letter-spacing:.01em}header span{color:var(--mut)}header .sp{flex:1}
button{font:600 13px inherit;font-family:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}button:hover{border-color:var(--acc)}button[aria-pressed=true]{background:var(--acc);color:#14102B;border-color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding:20px 24px;min-height:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;min-height:0;align-items:start}
.stage img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}.stage .p{max-height:100%}
.side{display:flex;flex-direction:column;gap:12px;overflow:auto}.side h2{font:700 30px/1.05 "Avenir Next Condensed","Avenir Next",sans-serif}
.side p{color:var(--mut)}.stars{display:flex;gap:4px}.stars button{border-radius:10px;padding:5px 10px}
textarea{width:100%;min-height:90px;background:#14161E;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9}#dlg[hidden]{display:none}#dlg>div{background:#14161E;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(640px,92vw);display:flex;flex-direction:column;gap:10px}#dlg textarea{min-height:300px;font:12px ui-monospace,monospace}
footer{display:flex;gap:6px;padding:10px 24px 16px;overflow-x:auto;border-top:1px solid var(--line)}
footer button{white-space:nowrap}footer button[data-star=true]::before{content:"★ "}
.kbd{color:var(--mut);font-size:12px}
@media(max-width:900px){main{grid-template-columns:1fr;overflow:auto}.stage{grid-template-columns:1fr}.stage .p{max-width:220px}body{overflow:auto;height:auto}}
</style>
<header><h1>Overheard · UI options</h1><span id="pos"></span><span class="sp"></span><span class="kbd">← → move · space star · 1–5 rate · e copy picks</span><button id="exp">Copy my picks</button></header>
<main><div class="stage"><img id="lg" alt=""><img id="sm" class="p" alt=""></div>
<div class="side"><h2 id="nm"></h2><p id="bl"></p><p class="kbd" id="rf"></p>
<div class="stars" id="rate"></div><button id="star" aria-pressed="false">☆ Star this one</button>
<textarea id="note" placeholder="What do you like or dislike here? (saved in this browser)"></textarea></div></main>
<footer id="strip"></footer>
<div id="dlg" hidden><div><h3>Your picks</h3><p class="kbd">Copy this and paste it into the chat. It becomes the data for your taste profile.</p><textarea id="out" readonly></textarea><div><button id="cp">Copy</button> <button id="cl">Close</button></div></div></div>
<script>
const SL=[{"id": "classic", "name": "Classic", "blurb": "The current look. Near-black cards, one purple accent, heat-colour lanes, big condensed headline.", "refs": "Hostinger cards, Apple Fitness"}, {"id": "paper", "name": "Paper", "blurb": "Editorial newsprint. Cream stock, heavy ink borders, italic serif headline, vermilion accent. Reads like a printed report.", "refs": "Newspaper front pages, Things 3"}, {"id": "terminal", "name": "Terminal", "blurb": "Phosphor CRT. Monospace everywhere, square corners, green glow, uppercase headline.", "refs": "Retro CRT UIs, htop"}, {"id": "brutal", "name": "Brutal", "blurb": "Neo-brutalism. Yellow page, white cards, thick black outlines and hard offset shadows, hot-pink accent.", "refs": "Gumroad, Figma brutalist kits"}, {"id": "signal", "name": "Signal", "blurb": "Black and red instrument panel. Mono labels, one red signal colour, grey ramp until something spikes.", "refs": "Nothing OS, Teenage Engineering"}, {"id": "aurora", "name": "Aurora", "blurb": "Glass over a moving-colour backdrop. Translucent blurred cards, cyan accent, soft light ramp.", "refs": "visionOS, Arc, Raycast"}, {"id": "mint", "name": "Mint", "blurb": "Calm clinical light theme. Mint page, white cards, teal accent, soft shadows.", "refs": "Apple Health, Stripe"}, {"id": "amber", "name": "Amber", "blurb": "Trading-desk amber on black. Dense, square, monospace, everything glows amber.", "refs": "Bloomberg Terminal"}, {"id": "violet", "name": "Violet", "blurb": "Deep purple with large 32px cards and bright lilac accent. Closest to the Hostinger screenshots you liked.", "refs": "Hostinger hPanel"}, {"id": "lime", "name": "Lime", "blurb": "Graphite with acid-lime accent, tight 8px corners. Sporty and sharp.", "refs": "Linear, Vercel Geist"}, {"id": "sand", "name": "Sand", "blurb": "Warm sand and forest green, serif display with sans body. Quiet and premium.", "refs": "Kinfolk, Aesop"}, {"id": "ice", "name": "Ice", "blurb": "Cool light blue, white cards, royal-blue accent with soft blue shadows.", "refs": "Stripe dashboard, Linear light"}, {"id": "dots", "name": "Dots", "blurb": "Nothing-style monochrome: black, white hairlines, mono labels, one red signal. Echoes the LED matrix on the board.", "refs": "Nothing OS, shadcn Nothing guide"}, {"id": "panel", "name": "Panel", "blurb": "Teenage Engineering instrument panel: aluminium grey, square cells with 1px gaps, orange accent, mono type.", "refs": "Teenage Engineering OP-1/EP-133"}, {"id": "linear", "name": "Linear", "blurb": "Calm density: neutral near-black, tiny tight rows, a single restrained violet accent.", "refs": "Linear"}, {"id": "crt", "name": "CRT", "blurb": "CRT phosphor with scanlines and glow, VT323-style type. Louder cousin of Terminal.", "refs": "Retro CRT / vector displays"}, {"id": "rings", "name": "Rings", "blurb": "Pure black with Apple-Fitness neon ramp (cyan, lime, yellow, pink-red) and generous 24px bento cards.", "refs": "Apple Fitness, Apple Health"}, {"id": "stripe", "name": "Stripe", "blurb": "Crisp white with indigo accent, layered soft shadows and a pale gradient wash at the top.", "refs": "Stripe Dashboard"}, {"id": "slate", "name": "Slate", "blurb": "Cool blue-grey cards with a single teal accent. Calm and technical.", "refs": "Linear, Vercel dashboards"}, {"id": "ember", "name": "Ember", "blurb": "Charcoal brown with a burnt-orange glow, like coals under ash.", "refs": "Warm night UIs"}, {"id": "oxide", "name": "Oxide", "blurb": "Deep green-black with rust accent. Serif headline against clean sans body.", "refs": "Editorial dark mode"}, {"id": "plum", "name": "Plum", "blurb": "Aubergine surfaces and a hot-pink accent with rounded, friendly type.", "refs": "Playful fintech apps"}, {"id": "cobalt", "name": "Cobalt", "blurb": "Midnight navy and electric cobalt. Crisp blue rules.", "refs": "Bloomberg-style panels"}, {"id": "graphite", "name": "Graphite", "blurb": "Pure monochrome. White accent on black, mono type, tiny radii.", "refs": "Teenage Engineering, brutalist docs"}, {"id": "moss", "name": "Moss", "blurb": "Forest floor green with a lime highlight and soft corners.", "refs": "Eco dashboards"}, {"id": "dusk", "name": "Dusk", "blurb": "Twilight purple and a warm gold accent.", "refs": "Sunset gradients"}, {"id": "neon", "name": "Neon", "blurb": "Synthwave: black violet with hot magenta outlines and glow.", "refs": "Retro-futurism"}, {"id": "ocean", "name": "Ocean", "blurb": "Deep sea teal with sky-blue accent and large soft cards.", "refs": "Weather apps"}, {"id": "rose", "name": "Rose", "blurb": "Blush paper, raspberry accent, Didot-style display type.", "refs": "Fashion editorial"}, {"id": "citrus", "name": "Citrus", "blurb": "Sunny yellow page, orange accent, hard offset shadows.", "refs": "Neo-brutalist landing pages"}, {"id": "sky", "name": "Sky", "blurb": "Airy pale blue with big rounded cards.", "refs": "Modern SaaS"}, {"id": "lavender", "name": "Lavender", "blurb": "Soft lilac surfaces and a vivid violet accent.", "refs": "Notion-style calm"}, {"id": "ledger", "name": "Ledger", "blurb": "Accounting paper: cream, thin ruled lines, blue pen accent, mono.", "refs": "Spreadsheets, bank statements"}, {"id": "blueprint", "name": "Blueprint", "blurb": "Drafting-table blue with white linework.", "refs": "Architectural plans"}, {"id": "chalk", "name": "Chalk", "blurb": "Green chalkboard with off-white chalk strokes.", "refs": "Classroom boards"}, {"id": "coral", "name": "Coral", "blurb": "Warm coral and white, friendly and bright.", "refs": "Consumer apps"}, {"id": "mono-light", "name": "Mono Light", "blurb": "Black on white, zero radius, no colour except heat lanes.", "refs": "Swiss print, Teenage Engineering"}, {"id": "olive", "name": "Olive", "blurb": "Army-surplus olive and khaki, serif headlines.", "refs": "Field notebooks"}, {"id": "sunrise", "name": "Sunrise", "blurb": "Peach dawn with a crimson accent.", "refs": "Morning light"}, {"id": "steel", "name": "Steel", "blurb": "Brushed-steel greys with a quiet slate-blue accent.", "refs": "Industrial control panels"}, {"id": "toxic", "name": "Toxic", "blurb": "Black with acid-green outlines and heavy type.", "refs": "Hazard signage"}, {"id": "copper", "name": "Copper", "blurb": "Dark walnut and polished-copper accent.", "refs": "Whisky labels"}, {"id": "glacier", "name": "Glacier", "blurb": "Cold white-teal with a deep cyan accent.", "refs": "Nordic design"}, {"id": "candy", "name": "Candy", "blurb": "Bubblegum pink, cyan accent, fat borders and pill-round cards.", "refs": "Toy packaging"}, {"id": "noir", "name": "Noir", "blurb": "Film-noir black, bone text, brass accent, hairline rules.", "refs": "Magazine mastheads"}, {"id": "pixel", "name": "Pixel", "blurb": "8-bit arcade: heavy borders, zero radius, yellow highlights.", "refs": "Retro games"}, {"id": "zen", "name": "Zen", "blurb": "Quiet off-white, huge radii, one muted amber accent.", "refs": "Japanese minimalism"}, {"id": "aero", "name": "Aero", "blurb": "Frosted-glass cards over a bright sky gradient.", "refs": "Windows Vista, visionOS"}];let i=0,P={};try{P=JSON.parse(localStorage.getItem('overheard.picks')||'{}')}catch(e){}
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem('overheard.picks',JSON.stringify(P))}catch(e){}},g=id=>P[id]||(P[id]={star:false,rating:0,note:''});
function show(n){i=(n+SL.length)%SL.length;const s=SL[i],p=g(s.id);$('lg').src=s.id+'-lg.jpg';$('sm').src=s.id+'-sm.jpg';$('nm').textContent=s.name;$('bl').textContent=s.blurb;$('rf').textContent=s.refs?'References: '+s.refs:'';
$('pos').textContent=(i+1)+' / '+SL.length;$('star').setAttribute('aria-pressed',p.star);$('star').textContent=(p.star?'★ Starred':'☆ Star this one');$('note').value=p.note;
$('rate').innerHTML=[1,2,3,4,5].map(r=>`<button data-r="${r}" aria-pressed="${p.rating>=r}">${r}</button>`).join('');strip()}
function strip(){$('strip').innerHTML=SL.map((s,k)=>`<button data-k="${k}" data-star="${g(s.id).star}" aria-pressed="${k===i}">${s.name}</button>`).join('')}
$('strip').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.k)};
$('rate').onclick=e=>{const b=e.target.closest('button');if(b){g(SL[i].id).rating=+b.dataset.r;save();show(i)}};
$('star').onclick=()=>{const p=g(SL[i].id);p.star=!p.star;save();show(i)};
$('note').oninput=e=>{g(SL[i].id).note=e.target.value;save()};
function exp(){const out=SL.map(s=>({id:s.id,name:s.name,...g(s.id)})).filter(x=>x.star||x.rating||x.note);$('out').value=JSON.stringify({exported:new Date().toISOString(),picks:out},null,1);$('dlg').hidden=false;$('out').select()}
$('cl').onclick=()=>{$('dlg').hidden=true};$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);$('cp').textContent='Copied'}catch(e){$('out').select();$('cp').textContent='Select all and copy'}};
$('exp').onclick=exp;
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();$('star').click()}else if('12345'.includes(e.key)&&e.key){g(SL[i].id).rating=+e.key;save();show(i)}else if(e.key==='e')exp()});
show(0);
</script></html>
