name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]   # the board ships an older Python than the laptop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install ruff pytest pillow
      - run: make ci
