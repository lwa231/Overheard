<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overheard: UI options</title>
<style>
:root{--bg:#0C0D12;--fg:#EEF0F6;--mut:rgba(238,240,246,.6);--line:rgba(255,255,255,.12);--acc:#A99BFF}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.45 "Avenir Next","Helvetica Neue",system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{display:flex;gap:16px;align-items:baseline;padding:16px 24px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1 "Avenir Next Condensed","Avenir Next",sans-serif;letter-spacing:.01em}header span{color:var(--mut)}header .sp{flex:1}
button{font:600 13px inherit;font-family:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}button:hover{border-color:var(--acc)}button[aria-pressed=true]{background:var(--acc);color:#14102B;border-color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding:20px 24px;min-height:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;min-height:0;align-items:start}
.stage img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}.stage .p{max-height:100%}
.side{display:flex;flex-direction:column;gap:12px;overflow:auto}.side h2{font:700 30px/1.05 "Avenir Next Condensed","Avenir Next",sans-serif}
.side p{color:var(--mut)}.stars{display:flex;gap:4px}.stars button{border-radius:10px;padding:5px 10px}
textarea{width:100%;min-height:90px;background:#14161E;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9}#dlg[hidden]{display:none}#dlg>div{background:#14161E;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(640px,92vw);display:flex;flex-direction:column;gap:10px}#dlg textarea{min-height:300px;font:12px ui-monospace,monospace}
footer{display:flex;gap:6px;padding:10px 24px 16px;overflow-x:auto;border-top:1px solid var(--line)}
footer button{white-space:nowrap}footer button[data-star=true]::before{content:"★ "}
.kbd{color:var(--mut);font-size:12px}
@media(max-width:900px){main{grid-template-columns:1fr;overflow:auto}.stage{grid-template-columns:1fr}.stage .p{max-width:220px}body{overflow:auto;height:auto}}
</style>
<header><h1>Overheard · UI options</h1><span id="pos"></span><span class="sp"></span><span class="kbd">← → move · space star · 1–5 rate · e copy picks</span><button id="exp">Copy my picks</button></header>
<main><div class="stage"><img id="lg" alt=""><img id="sm" class="p" alt=""></div>
<div class="side"><h2 id="nm"></h2><p id="bl"></p><p class="kbd" id="rf"></p>
<div class="stars" id="rate"></div><button id="star" aria-pressed="false">☆ Star this one</button>
<textarea id="note" placeholder="What do you like or dislike here? (saved in this browser)"></textarea></div></main>
<footer id="strip"></footer>
<div id="dlg" hidden><div><h3>Your picks</h3><p class="kbd">Copy this and paste it into the chat. It becomes the data for your taste profile.</p><textarea id="out" readonly></textarea><div><button id="cp">Copy</button> <button id="cl">Close</button></div></div></div>
<script>
const SL=__SLIDES__;let i=0,P={};try{P=JSON.parse(localStorage.getItem('overheard.picks')||'{}')}catch(e){}
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem('overheard.picks',JSON.stringify(P))}catch(e){}},g=id=>P[id]||(P[id]={star:false,rating:0,note:''});
function show(n){i=(n+SL.length)%SL.length;const s=SL[i],p=g(s.id);$('lg').src=s.id+'-lg.jpg';$('sm').src=s.id+'-sm.jpg';$('nm').textContent=s.name;$('bl').textContent=s.blurb;$('rf').textContent=s.refs?'References: '+s.refs:'';
$('pos').textContent=(i+1)+' / '+SL.length;$('star').setAttribute('aria-pressed',p.star);$('star').textContent=(p.star?'★ Starred':'☆ Star this one');$('note').value=p.note;
$('rate').innerHTML=[1,2,3,4,5].map(r=>`<button data-r="${r}" aria-pressed="${p.rating>=r}">${r}</button>`).join('');strip()}
function strip(){$('strip').innerHTML=SL.map((s,k)=>`<button data-k="${k}" data-star="${g(s.id).star}" aria-pressed="${k===i}">${s.name}</button>`).join('')}
$('strip').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.k)};
$('rate').onclick=e=>{const b=e.target.closest('button');if(b){g(SL[i].id).rating=+b.dataset.r;save();show(i)}};
$('star').onclick=()=>{const p=g(SL[i].id);p.star=!p.star;save();show(i)};
$('note').oninput=e=>{g(SL[i].id).note=e.target.value;save()};
function exp(){const out=SL.map(s=>({id:s.id,name:s.name,...g(s.id)})).filter(x=>x.star||x.rating||x.note);$('out').value=JSON.stringify({exported:new Date().toISOString(),picks:out},null,1);$('dlg').hidden=false;$('out').select()}
$('cl').onclick=()=>{$('dlg').hidden=true};$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);$('cp').textContent='Copied'}catch(e){$('out').select();$('cp').textContent='Select all and copy'}};
$('exp').onclick=exp;
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();$('star').click()}else if('12345'.includes(e.key)&&e.key){g(SL[i].id).rating=+e.key;save();show(i)}else if(e.key==='e')exp()});
show(0);
</script></html>
